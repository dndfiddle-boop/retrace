<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="Record the path you walk, then follow your own footprints back through your phone's camera.">
<meta name="theme-color" content="#0c1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retrace">
<title>Retrace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c1116'/%3E%3Cellipse cx='23' cy='40' rx='7' ry='11' fill='%23ffb547'/%3E%3Cellipse cx='41' cy='22' rx='7' ry='11' fill='%23ffb547'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<style>
/* Layout: full-bleed map or camera underneath; road-sign style controls float on the top and bottom edges */
:root {
  --night: #0c1116;          /* app ground */
  --panel: #151c24;          /* bars and sheets */
  --panel-2: #1f2934;        /* raised controls */
  --panel-glass: rgba(21, 28, 36, .86);
  --line: #2b3744;
  --ink: #eef2f6;
  --ink-dim: #95a3b2;
  --trail: #ffb547;          /* footprint amber */
  --trail-ink: #2a1a00;
  --trail-soft: rgba(255, 181, 71, .22);
  --rec: #ff5d5d;
  --rec-soft: rgba(255, 93, 93, .28);
  --me: #6cb8ff;             /* your position */
  --spot: #c6a8ff;           /* saved spots */
  --spot-ink: #1d1330;
  --good: #4fd18b;
  --fade-top: rgba(12, 17, 22, .8);
  --fade-bottom: rgba(12, 17, 22, .92);
  --scrim: rgba(5, 8, 11, .6);
  --shadow: 0 12px 28px rgba(0, 0, 0, .45);
  /* Overpass descends from Highway Gothic, the US road-sign face */
  --font-sign: "Overpass", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "Overpass Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night); color: var(--ink);
  font: 15px/1.45 var(--font-sign);
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
input { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-touch-callout: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
a { color: inherit; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

#app { position: fixed; inset: 0; overflow: hidden; }
.view { position: absolute; inset: 0; }
#mapView { z-index: 0; background: var(--night); -webkit-touch-callout: none; }
#groundView { z-index: 1; background: radial-gradient(130% 70% at 50% 100%, var(--panel-2), var(--night) 75%); }
#cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; }
#groundView.live #cam { opacity: 1; }
#ground { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.nomap { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 32px; text-align: center; color: var(--ink-dim); }

/* ---------- top band ---------- */
.top {
  position: absolute; z-index: 5; top: 0; left: 0; right: 0;
  display: grid; gap: 8px; justify-items: start;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--fade-top), transparent);
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
.seg button {
  border: 0; background: none; padding: 7px 15px; border-radius: 999px;
  font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim);
}
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--ink); color: var(--night); }
.gps {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line);
  font: 600 12px/1 var(--font-num); color: var(--ink-dim); white-space: nowrap;
}
.gps::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-dim); }
.gps[data-q="good"]::before { background: var(--good); }
.gps[data-q="ok"]::before { background: var(--trail); }
.gps[data-q="bad"]::before { background: var(--rec); }
.gps[data-q="demo"]::before { background: var(--spot); }
.status {
  display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; row-gap: 2px; max-width: 100%;
  padding: 9px 14px; border-radius: 14px;
  background: var(--panel-glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.st-main { font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
.st-sub { color: var(--ink-dim); font-size: 13px; }
.status .num { color: var(--trail); font-size: 14px; font-weight: 700; }
.status .num.dim { color: var(--ink-dim); }
.led { width: 9px; height: 9px; border-radius: 50%; align-self: center; flex: none; }
.led.rec { background: var(--rec); box-shadow: 0 0 0 4px var(--rec-soft); animation: blink 1.2s infinite; }
.led.go { background: var(--trail); box-shadow: 0 0 0 4px var(--trail-soft); }
.guide {
  display: flex; align-items: center; gap: 12px; max-width: 100%;
  padding: 8px 10px 8px 8px; border-radius: 16px;
  background: var(--panel-glass); border: 1px solid var(--trail);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.guide-arrow { flex: none; width: 48px; height: 48px; border-radius: 12px; background: var(--trail); color: var(--trail-ink); display: grid; place-items: center; }
#guideArrow { width: 30px; height: 30px; transition: transform .15s linear; }
.guide-text { min-width: 0; }
.guide-main { font-weight: 800; font-size: 18px; line-height: 1.15; }
.guide-sub { font: 600 13px/1.3 var(--font-num); color: var(--ink-dim); margin-top: 3px; }
.hint { max-width: 100%; padding: 7px 12px; border-radius: 10px; background: var(--ink); color: var(--night); font-weight: 700; font-size: 13px; }
.align {
  display: inline-flex; align-items: center; gap: 10px; padding: 4px 4px 4px 12px; border-radius: 999px;
  background: var(--panel-glass); border: 1px solid var(--line); color: var(--ink-dim);
  font: 600 12px/1 var(--font-num);
}
.align-reset { border: 0; border-radius: 999px; padding: 6px 10px; background: var(--panel-2); color: var(--ink); font: 800 11px/1 var(--font-sign); letter-spacing: .08em; text-transform: uppercase; }

/* ---------- bottom dock ---------- */
.dock {
  position: absolute; z-index: 5; left: 0; right: 0; bottom: 0;
  display: grid; justify-items: center; gap: 12px;
  padding-top: 36px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(transparent, var(--fade-bottom) 40%);
  pointer-events: none;
}
.dock > * { pointer-events: auto; }
.dir { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 100%; max-width: 440px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.dir button {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; background: none; padding: 10px 6px; border-radius: 9px;
  font-weight: 800; font-size: 14px; color: var(--ink-dim);
}
.dir button[aria-checked="true"] { background: var(--trail); color: var(--trail-ink); }
.dir button { min-width: 0; }
.dir button span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dir svg { width: 16px; height: 16px; flex: none; }
.dockrow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; width: 100%; max-width: 440px; }
.side {
  display: grid; justify-items: center; gap: 4px; padding: 11px 6px 9px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
}
.side svg { width: 22px; height: 22px; }
.main {
  width: 92px; height: 92px; border: 0; border-radius: 50%; padding: 0 10px;
  display: grid; place-items: center; align-content: center; gap: 3px;
  background: var(--trail); color: var(--trail-ink);
  font-size: 12px; font-weight: 800; line-height: 1.05; letter-spacing: .06em; text-transform: uppercase; text-align: center;
  box-shadow: 0 0 0 6px var(--trail-soft), var(--shadow);
}
.main svg { width: 26px; height: 26px; }
.main[data-mode="recording"] { background: var(--rec); color: var(--ink); box-shadow: 0 0 0 6px var(--rec-soft), var(--shadow); }
.main[data-mode="guiding"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 2px var(--trail), var(--shadow); }
.main:active, .side:active, .btn:active, .dir button:active { transform: scale(.97); }
.attrib { font-size: 10px; color: var(--ink-dim); text-align: center; }
.attrib a { color: var(--ink-dim); }
.recenter {
  position: absolute; z-index: 4;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 220px);
  display: flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); color: var(--me);
  font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
}
.recenter svg { width: 16px; height: 16px; }

/* ---------- map markers ---------- */
.leaflet-container { background: var(--night); font-family: var(--font-sign); }
/* OpenStreetMap's light tiles, turned into a night map */
.night-tiles { filter: invert(1) hue-rotate(185deg) brightness(.82) contrast(.92) saturate(.55); }
.ri { background: none; border: 0; }
.me { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; }
.me .dot { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; background: var(--me); border: 3px solid var(--ink); box-shadow: 0 0 0 6px rgba(108, 184, 255, .25); }
.me .cone {
  position: absolute; inset: -14px; border-radius: 50%; opacity: 0;
  background: conic-gradient(from -28deg, rgba(108, 184, 255, .6), rgba(108, 184, 255, 0) 56deg, transparent 0);
}
.endpin {
  position: absolute; left: 0; top: 0; transform: translate(-50%, calc(-100% - 8px));
  padding: 3px 8px 2px; border-radius: 6px; white-space: nowrap;
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
  font: 800 11px/1.2 var(--font-sign); letter-spacing: .08em; text-transform: uppercase;
}
.endpin::after { content: ""; position: absolute; left: 50%; bottom: -13px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--trail); box-shadow: 0 0 0 3px var(--night); }
.endpin.dest { background: var(--trail); color: var(--trail-ink); border-color: transparent; }
.spotpin { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: grid; justify-items: center; }
.spotpin span { padding: 3px 8px 2px; border-radius: 6px; background: var(--spot); color: var(--spot-ink); font: 700 12px/1.2 var(--font-sign); white-space: nowrap; }
.spotpin::after { content: ""; width: 2px; height: 12px; background: var(--spot); }
.spotpin.on span { box-shadow: 0 0 0 3px var(--me); }
.chev { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--trail); box-shadow: 0 0 0 2px var(--night); }
.chev::before { content: ""; position: absolute; left: 5px; top: 6px; width: 6px; height: 6px; border-left: 2px solid var(--trail-ink); border-top: 2px solid var(--trail-ink); transform: rotate(45deg); }

/* ---------- sheets ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); }
.sheet {
  position: absolute; z-index: 21; left: 0; right: 0; bottom: 0; margin: 0 auto;
  max-width: 560px; max-height: 88%; overflow-y: auto;
  display: grid; gap: 12px; align-content: start;
  padding-top: 20px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
  animation: up .22s ease-out;
  -webkit-user-select: text; user-select: text;
}
.sheet h2 { margin: 0; font-size: 22px; line-height: 1.15; font-weight: 800; text-wrap: balance; }
.sheet h3 { margin: 10px 0 0; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.sheet p { margin: 0; max-width: 62ch; }
.muted { color: var(--ink-dim); }
.small { font-size: 13px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--trail); }
.card { display: grid; gap: 8px; padding: 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.card-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.title { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.big { font-size: 20px; font-weight: 700; color: var(--trail); white-space: nowrap; }
.meta { color: var(--ink-dim); font-size: 13px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row.end { justify-content: flex-end; }
.col { display: grid; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 11px 16px; border-radius: 12px; font-weight: 700; font-size: 15px; }
.btn.primary { background: var(--trail); color: var(--trail-ink); border-color: transparent; }
.btn.danger { color: var(--rec); border-color: var(--rec-soft); }
.btn.ghost { background: none; }
.btn.small { padding: 7px 11px; font-size: 13px; border-radius: 10px; flex: none; }
.btn.on { background: var(--me); color: var(--night); border-color: transparent; }
.btn[data-armed] { background: var(--rec); color: var(--ink); border-color: transparent; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.li-main { flex: 1; min-width: 0; }
.pin-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--spot); flex: none; }
.card .list li { background: var(--panel); }
.stop-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--trail); flex: none; }
.stop-dot.end { border-radius: 50%; box-shadow: 0 0 0 3px var(--trail-soft); }
.name-row { display: flex; gap: 8px; }
.name-row .field { flex: 1; min-width: 0; }
.eyebrow.spot { color: var(--spot); }
.btn:disabled { opacity: .45; cursor: default; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 4px 0; }
.setting small { display: block; color: var(--ink-dim); font-size: 12px; }
.seg.small button { padding: 6px 12px; font-size: 11px; }
.switch { flex: none; position: relative; width: 50px; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: var(--night); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink-dim); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--trail); border-color: transparent; }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--trail-ink); }
label { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--night); color: var(--ink); font: 600 17px var(--font-sign); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: none; color: var(--ink); padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.sheet-form { display: grid; gap: 12px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--trail); color: var(--trail-ink); font: 800 13px/1 var(--font-num); }
.warn { padding: 10px 12px; border-radius: 10px; background: var(--rec-soft); color: var(--ink); font-weight: 600; }
.toast {
  position: absolute; z-index: 30; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 210px);
  width: max-content; max-width: calc(100% - 32px);
  padding: 10px 14px; border-radius: 12px;
  background: var(--ink); color: var(--night);
  font-weight: 700; font-size: 14px; text-align: center; box-shadow: var(--shadow);
}

@keyframes blink { 50% { opacity: .35; } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .led.rec, .sheet { animation: none; }
  #guideArrow { transition: none; }
}
@media (max-height: 700px) {
  .main { width: 80px; height: 80px; }
  .dock { gap: 8px; padding-top: 24px; }
  .recenter, .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 190px); }
}
</style>
</head>
<body>
<div id="app">
  <div id="mapView" class="view" aria-label="Map of your trail"></div>
  <div id="groundView" class="view" hidden>
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="ground" role="img" aria-label="Camera view with your footprints drawn on the ground"></canvas>
  </div>

  <header class="top">
    <div class="toprow">
      <div class="seg" role="tablist" aria-label="View">
        <button id="tabMap" role="tab" aria-selected="true">Map</button>
        <button id="tabGround" role="tab" aria-selected="false">Ground</button>
      </div>
      <span id="gps" class="gps">Finding GPS…</span>
    </div>
    <div id="status" class="status"></div>
    <div id="guide" class="guide" hidden>
      <div class="guide-arrow"><svg id="guideArrow" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 2 26 27l-11-5.5L4 27Z" fill="currentColor"/></svg></div>
      <div class="guide-text"><div id="guideMain" class="guide-main"></div><div id="guideSub" class="guide-sub"></div></div>
      <button id="guideStop" class="btn small ghost" hidden>End</button>
    </div>
    <div id="hint" class="hint" hidden></div>
    <div id="align" class="align" hidden><span id="alignText"></span><button id="alignReset" class="align-reset">Reset</button></div>
  </header>

  <button id="recenter" class="recenter" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Recenter
  </button>

  <footer class="dock">
    <div id="dir" class="dir" role="radiogroup" aria-label="Which way the footprints lead" hidden>
      <button id="dirBack" role="radio" aria-checked="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="dirBackText">Back to start</span></button>
      <button id="dirFwd" role="radio" aria-checked="false"><span id="dirFwdText">Forward to end</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="dockrow">
      <button id="btnTrails" class="side">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Trails
      </button>
      <button id="btnMain" class="main"></button>
      <button id="btnSpot" class="side"></button>
    </div>
    <div id="attrib" class="attrib">Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
  </footer>

  <div id="scrim" class="scrim" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  const me = st.pos || st.sim || { lat: 40.77405, lon: -73.97085 };   // fallback: The Mall, Central Park
  // Walk outwards from where you stand, then reverse it so the trail ends at your feet.
  const legs = [[33, 0], [27, 35], [42, 10], [21, -70], [45, -15], [36, 40]];
  let x = 0, y = 0, hd = currentHeading() ?? 0;
  const out = [[0, 0]];
  for (const [len, turn] of legs) {
    hd += turn;
    for (let i = 0; i < Math.round(len / 3); i++) {
      x += 3 * Math.sin(hd * D2R); y += 3 * Math.cos(hd * D2R);
      out.push([x + (Math.random() - 0.5) * 0.6, y + (Math.random() - 0.5) * 0.6]);
    }
  }
  out.reverse();
  const t0 = Date.now() - out.length * 2400;
  const points = out.map(([px, py], i) => { const [lat, lon] = fromXY(px, py, me.lat, me.lon); return [+lat.toFixed(7), +lon.toFixed(7), t0 + i * 2400, 5]; });
  if (db.current && db.current.points.length > 1) db.archive.unshift(db.current);
  const n = points.length;
  db.current = { id: uid(), name: 'Demo trail', created: t0, points, stops: [
    { id: uid(), name: 'Start', i: 0 },
    { id: uid(), name: 'Coffee cart', i: Math.round(n * 0.35) },
    { id: uid(), name: 'Fountain', i: Math.round(n * 0.7) },
    { id: uid(), name: 'End', i: n - 1 },
  ] };
  db.dir = 'back'; db.recording = false; st.mode = 'stopped'; geo = null; st.prog = null;
  if (!st.pos) st.sim = { lat: me.lat, lon: me.lon };
  save(true); closeSheet(); refresh(); fitTrail(); updateMe();
  toast('Demo trail loaded. Tap Follow trail, then point your phone at the ground.', 5000);
}

function guideInfo() {
  const me = here();
  if (!me) return null;
  const spot = st.target && spotById(st.target);
  if (spot) {
    const [x, y] = toXY(spot.lat, spot.lon, me.lat, me.lon);
    return { aim: [x, y], remain: Math.hypot(x, y), dest: spot.name, spot };
  }
  if (st.mode !== 'guiding') return null;
  const f = trailFrame();
  if (!f) return null;
  const { g, n } = f, off = n.d > 25;
  const a = off ? [n.x, n.y] : at(g, Math.min(g.total, n.s + 6));
  const d = destStop();
  return { aim: [a[0] + f.ox, a[1] + f.oy], remain: g.total - n.s + n.d, dest: d ? d.name : db.dir === 'back' ? 'start' : 'end', off, offD: n.d };
}
function updateGuide() {
  const el = $('#guide'), gi = guideInfo();
  if (!gi) { el.hidden = true; return; }
  const hd = currentHeading(), brg = (Math.atan2(gi.aim[0], gi.aim[1]) / D2R + 360) % 360;
  let main, turn;
  if (hd == null) { turn = brg; main = 'Head ' + compass(brg); }
  else {
    turn = angDiff(hd, brg);
    const a = Math.abs(turn), side = turn < 0 ? 'left' : 'right';
    main = a <= 25 ? 'Straight ahead' : a <= 70 ? 'Bear ' + side : a <= 145 ? 'Turn ' + side : 'Turn around';
  }
  if (gi.off) main = 'Walk to the trail: ' + main.toLowerCase();
  $('#guideArrow').style.transform = `rotate(${turn.toFixed(1)}deg)`;
  $('#guideMain').textContent = main;

  $('#guideStop').hidden = !gi.spot;

  if (gi.spot && gi.remain < 10) {
    st.target = null; renderSpots(); updateMe();

}

  st.follow = true; $('#recenter').hidden = true;
  const me = here();
  if (me && map) map.setView([me.lat, me.lon], Math.max(map.getZoom(), 17));
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  keepAwake(needAwake());
  if (st.view === 'ground') startCamera();
});
addEventListener('pagehide', () => save(true));
let ticks = 0;
setInterval(() => {
  ticks++;
  updateGuide(); updateCone(); updateHint(); updateAlign();
  if (ticks % 4 === 0 && st.mode === 'recording') updateStatus();
}, 250);

initMap();
refresh();
if (!db.seenIntro) openIntro();
else startGPS();
if (st.mode === 'recording') { keepAwake(true); toast('Still recording your trail.'); }
})();
</script>
</body>
</html>
